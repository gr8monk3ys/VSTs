name: Plugin suggestion
description: Suggest a free plugin for the catalog
title: "[plugin] "
labels: ["plugin-suggestion"]
body:
  - type: input
    id: name
    attributes:
      label: Plugin name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website
      description: The vendor's or project's own page — not a re-hosting site.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What is it and why does it belong here?
      description: One or two sentences. The catalog is curated — "it's free" alone isn't enough.
    validations:
      required: true
  - type: checkboxes
    id: criteria
    attributes:
      label: Catalog criteria
      options:
        - label: Legally free from the official source (not a trial, not pirated)
          required: true
        - label: Has a direct, stable download URL (no account wall) — otherwise it goes in the manual-download list
        - label: Available for more than one platform
  - type: input
    id: platforms
    attributes:
      label: Platforms
      placeholder: "macOS / Windows / Linux"
