name: update-manifest

# Self-updating manifest: detect upstream release/content drift and open a PR
# with refreshed URLs, filenames, and hashes. Design:
# docs/superpowers/specs/2026-05-09-self-updating-manifest-design.md
#
# Requires "Allow GitHub Actions to create and approve pull requests" to be
# enabled under Settings → Actions → General → Workflow permissions.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Detect and apply upstream drift
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/download-plugins.py --check-updates --apply | tee drift-report.txt
          if git diff --quiet plugins.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate refreshed manifest
        if: steps.drift.outputs.changed == 'true'
        run: |
          pip install pytest jsonschema
          python -m json.tool plugins.json > /dev/null
          pytest tests/test_schema.py -q

      - name: Open PR with refreshed manifest
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412
        with:
          add-paths: plugins.json
          branch: auto/manifest-refresh
          commit-message: 'fix(data): refresh plugin manifest from upstream releases'
          title: 'fix(data): refresh plugin manifest from upstream releases'
          body: |
            Automated refresh: `scripts/download-plugins.py --check-updates --apply`
            detected upstream drift and re-pinned URLs, filenames, and SHA-256
            hashes from the live releases.

            Review the diff before merging — new hashes are trust-on-first-use
            (`hash_source: self`), so this PR is the moment a new upstream
            binary gets trusted.
          labels: automated,data
          delete-branch: true
