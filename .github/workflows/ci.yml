permissions: read-all

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to check if download URLs are still valid
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate plugins.json (JSON + schema)
        run: |
          pip install jsonschema
          python scripts/validate_manifest.py

      - name: Check for upstream version drift
        run: |
          python3 scripts/download-plugins.py --check-updates
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Python
        run: |
          pip install ruff
          ruff check src/ scripts/ tests/
          ruff format --check src/ scripts/ tests/

      - name: Check syntax
        run: python -m py_compile src/free_vst_plugins/cli.py scripts/download-plugins.py

  test-script:
    name: Test Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']
        exclude:
          # Only test all Python versions on Ubuntu
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.12'
    env:
      PYTHONUTF8: '1'  # Ensure UTF-8 output on Windows (fixes UnicodeEncodeError for box-drawing chars)

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test --help
        run: python scripts/download-plugins.py --help

      - name: Test --list
        run: python scripts/download-plugins.py --list

      - name: Test platform detection
        run: |
          python -c "
          import platform
          system = platform.system().lower()
          expected = {'darwin': 'macos', 'windows': 'windows', 'linux': 'linux'}
          detected = expected.get(system, system)
          print(f'Detected platform: {detected}')
          assert detected in ['macos', 'windows', 'linux'], f'Unknown platform: {detected}'
          "

      - name: Run unit + integration tests
        run: |
          pip install pytest jsonschema
          pytest tests/ -v

  check-urls:
    name: Validate Plugin URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Check URLs are reachable
        run: python scripts/validate_urls.py

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: false
          load: true  # Load image into Docker daemon so 'docker run' can access it
          tags: free-vst-plugins:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm free-vst-plugins:test --list
          docker run --rm free-vst-plugins:test --help

