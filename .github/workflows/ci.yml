permissions: read-all

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly to check if download URLs are still valid
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # uv supplies the interpreter and the locked dev tools (uv.lock), so CI
      # runs the same ruff/pytest/jsonschema versions as `uv run` locally.
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'

      - name: Check for upstream version drift
        run: uv run --frozen python scripts/download-plugins.py --check-updates
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything this job gates on: manifest schema, ruff lint + format,
      # syntax. Same command locally: uv run python scripts/verify.py lint
      - name: Verify (lint)
        run: uv run --frozen python scripts/verify.py lint

  test-script:
    name: Test Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']
        exclude:
          # Only test all Python versions on Ubuntu
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.12'
    # No PYTHONUTF8 here on purpose: Windows runs must see the same cp1252
    # redirected stdout that users get, or an encoding crash passes CI.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # setup-python has no 3.9 build for ubuntu-26.04 (ubuntu-latest since
      # 2026-10); uv's managed interpreters do, so the requires-python floor
      # stays tested without renaming the required "Test Script (...)" checks.
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # --help, --list, platform detection, pytest. Same command locally:
      # uv run python scripts/verify.py test
      - name: Verify (test)
        run: uv run --frozen python scripts/verify.py test

  check-urls:
    name: Validate Plugin URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      # Report-only: this gates on third-party uptime, not on this repo.
      # Dead links are surfaced as annotations + job summary; update-manifest
      # opens the PR that re-pins them.
      - name: Check URLs are reachable
        run: python scripts/validate_urls.py
        continue-on-error: true
